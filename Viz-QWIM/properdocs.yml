site_name: Viz-QWIM Documentation
site_description: Quantitative Wealth and Investment Management Dashboard
site_url: https://example.com/viz-qwim/
docs_dir: docs
theme:
  name: material

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_api_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]        # ensure workspace root is always in Python path
          options:
            docstring_style: numpy
            allow_inspection: true
            force_inspection: false
            show_source: true
            show_root_heading: true
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: false
  - autorefs
  - coverage:
      page_path: coverage
      html_report_dir: htmlcov

# Fail --strict on link or nav drift
validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Docs Notes: README_docs.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Setup Tab: user-guide/tab-setup.md
    - Overview Tab: user-guide/tab-overview.md
    - Clients Tab: user-guide/tab-clients.md
    - Portfolios Tab: user-guide/tab-portfolios.md
    - Products Tab: user-guide/tab-products.md
    - Results Tab: user-guide/tab-results.md
